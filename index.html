<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1 id="title">로그인</h1>
    <p class="sub" id="subtitle">투두리스트를 사용하려면 로그인하세요.</p>

    <form id="authForm">
      <label for="userId">아이디</label>
      <input type="text" id="userId" placeholder="아이디 입력" autocomplete="username" />

      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password" />

      <div id="confirmWrap" style="display:none">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input type="password" id="passwordConfirm" placeholder="비밀번호 다시 입력" />
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">로그인</button>
      <p class="msg" id="msg"></p>
    </form>

    <p class="switch">
      <span id="switchText">계정이 없으신가요?</span>
      <a id="switchLink">회원가입</a>
    </p>
  </div>

  <script src="auth.js"></script>
</body>
</html>
